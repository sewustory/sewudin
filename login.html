<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Kostory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#020617,#020617,#020617);
}
.card{
  width:340px;background:#020617;color:white;
  padding:30px;border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h2{text-align:center;margin-bottom:20px}
input{
  width:100%;padding:14px;margin-bottom:14px;
  border-radius:10px;border:none;font-size:15px;
}
button{
  width:100%;padding:14px;border:none;
  border-radius:12px;font-weight:bold;
  background:#22c55e;color:black;font-size:16px;
}
button:hover{opacity:.9}
</style>
</head>

<body>
<div class="card">
  <h2>Login Kostory</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">MASUK</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
});

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email,password)
  .then(res=>{
    const uid = res.user.uid;
    firebase.database().ref("users/"+uid).once("value").then(snap=>{
      if(!snap.exists()){ alert("User tidak punya role"); return; }
      snap.val().role==="admin"
        ? location.href="admin.html"
        : location.href="pengajuan.html";
    });
  })
  .catch(err=>alert(err.message));
}
</script>
</body>
</html>
