<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pengajuan Biaya Kost</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}
header {
  background: #050b1f;
  color: #fff;
  padding: 18px 24px;
  font-size: 22px;
  font-weight: bold;
}
.container {
  max-width: 1000px;
  margin: auto;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,.05);
}
select, input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  text-align: center;
}
th {
  background: #f1f5f9;
}
.total {
  font-size: 18px;
  font-weight: bold;
  text-align: right;
  margin-top: 16px;
}
button {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  background: #22c55e;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>
<header style="display:flex;justify-content:space-between;align-items:center">
  <span>Pengajuan Bonus</span>

  <button onclick="lihatPengajuan()" 
    style="
      background:#2563eb;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    ">
    📄 Lihat Pengajuan
  </button>
</header>


<div class="container">
  <div class="card">

    <div style="display:flex;gap:12px;margin-bottom:16px">
      <select id="kostorySelect">
        <option value="">Pilih Kostory</option>
      </select>

      <div style="display:flex;gap:16px;align-items:center">
  <div>
    <label style="font-weight:bold;margin-right:6px">Tahun:</label>
    <select id="tahun"></select>
  </div>

  <div>
    <label style="font-weight:bold;margin-right:6px">Bulan:</label>
    <select id="bulan"></select>
  </div>
</div>

    </div>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Harga</th>
          <th>Satuan</th>
          <th>Volume</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="itemTable"></tbody>
    </table>

    <div class="total">
      Total: Rp <span id="total">0</span>
    </div>

    <button onclick="kirimPengajuan()">KIRIM PENGAJUAN</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const bulanSelect = document.getElementById("bulan");
const tahunSelect = document.getElementById("tahun");

const bulanList = [
  { v: "01", n: "Januari" },
  { v: "02", n: "Februari" },
  { v: "03", n: "Maret" },
  { v: "04", n: "April" },
  { v: "05", n: "Mei" },
  { v: "06", n: "Juni" },
  { v: "07", n: "Juli" },
  { v: "08", n: "Agustus" },
  { v: "09", n: "September" },
  { v: "10", n: "Oktober" },
  { v: "11", n: "November" },
  { v: "12", n: "Desember" }
];

// placeholder
bulanSelect.innerHTML = `<option value="">Pilih Bulan</option>`;
tahunSelect.innerHTML = `<option value="">Pilih Tahun</option>`;

// isi bulan
bulanList.forEach(b => {
  bulanSelect.innerHTML += `<option value="${b.v}">${b.n}</option>`;
});

// isi tahun (mundur)
const tahunNow = new Date().getFullYear();
for (let t = tahunNow + 1; t >= tahunNow - 5; t--) {
  tahunSelect.innerHTML += `<option value="${t}">${t}</option>`;
}
  
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let hargaData = {};
let userData = {};

/* ================= AUTH ================= */
onAuthStateChanged(auth, async user => {
  if (!user) location.href = "login.html";

  const snap = await get(ref(db, "users/" + user.uid));
  if (!snap.exists() || snap.val().role !== "karyawan") {
    alert("Bukan karyawan");
    location.href = "login.html";
  }
  userData = snap.val();
});

/* ================= LOAD KOSTORY ================= */
onValue(ref(db, "cabang"), snap => {
  kostorySelect.innerHTML = `<option value="">Pilih Kostory</option>`;
  snap.forEach(c => {
    kostorySelect.innerHTML += `
      <option value="${c.val().nama}">${c.val().nama}</option>
    `;
  });
});

/* ================= LOAD HARGA ================= */
onValue(ref(db, "harga"), snap => {
  hargaData = {};
  itemTable.innerHTML = "";

  snap.forEach(h => {
    hargaData[h.key] = h.val();
    itemTable.innerHTML += `
      <tr data-key="${h.key}">
        <td>${h.val().nama}</td>
        <td>Rp ${h.val().harga.toLocaleString()}</td>
        <td>${h.val().satuan}</td>
        <td><input type="number" min="0" value="0" oninput="hitung()"></td>
        <td>Rp 0</td>
      </tr>
    `;
  });
});

/* ================= HITUNG ================= */
window.hitung = function () {
  let total = 0;
  document.querySelectorAll("#itemTable tr").forEach(row => {
    const key = row.dataset.key;
    const volume = Number(row.querySelector("input").value);
    const harga = hargaData[key].harga;
    const subtotal = volume * harga;
    row.children[4].innerText = "Rp " + subtotal.toLocaleString();
    total += subtotal;
  });
  document.getElementById("total").innerText = total.toLocaleString();
};

/* ================= KIRIM ================= */
window.kirimPengajuan = function () {
  if (!kostorySelect.value || !bulanSelect.value || !tahunSelect.value) {

    alert("Lengkapi data");
    return;
  }

  const items = [];
  document.querySelectorAll("#itemTable tr").forEach(row => {
    const volume = Number(row.querySelector("input").value);
    if (volume > 0) {
      const key = row.dataset.key;
      items.push({
        nama: hargaData[key].nama,
        harga: hargaData[key].harga,
        satuan: hargaData[key].satuan,
        volume,
        subtotal: volume * hargaData[key].harga
      });
    }
  });

  if (!items.length) {
    alert("Isi minimal satu volume");
    return;
  }

  push(ref(db, "pengajuan"), {
  kostory: kostorySelect.value,
  bulan: `${tahun.value}-${bulan.value}`,
  tahun: tahun.value,
  namaBulan: bulan.options[bulan.selectedIndex].text,
  items,
  total: items.reduce((a,b)=>a+b.subtotal,0),
  status: "pending",
  createdAt: Date.now(),
  oleh: userData.email
});


  alert("Pengajuan terkirim");
  location.reload();
};

  window.lihatPengajuan = function () {
  location.href = "list-pengajuan.html";
};
  
</script>
</body>
</html>
