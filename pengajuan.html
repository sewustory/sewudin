<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pengajuan Bonus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#f8fafc;font-family:Arial}
header{background:#020617;color:white;padding:16px;font-weight:bold}
.box{background:white;margin:16px;padding:16px;border-radius:14px}
select,input,button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:10px;border:1px solid #cbd5e1;
}
button{
  background:#22c55e;border:none;font-weight:bold;
}
</style>
</head>

<body>
<header>Pengajuan Bonus</header>

<div class="box">
  <label>Kostory</label>
  <select id="cabang"></select>

  <label>Volume</label>
  <input id="volume" type="number">

  <button onclick="kirim()">Kirim Pengajuan</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
});

firebase.auth().onAuthStateChanged(u=>{
  if(!u) location.href="login.html";
});

firebase.database().ref("cabang").on("value",snap=>{
  cabang.innerHTML="";
  snap.forEach(c=>{
    cabang.innerHTML+=`<option>${c.val().nama}</option>`;
  });
});

function kirim(){
  alert("Pengajuan terkirim (dummy)");
}
</script>
</body>
</html>
