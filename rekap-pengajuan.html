<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#fff;
  margin:0;
  padding:24px;
  color:#000;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h1{
  font-size:22px;
  margin:0;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th, td{
  border:1px solid #000;
  padding:6px;
  text-align:center;
}

th{
  background:#f1f1f1;
}

tfoot td{
  font-weight:bold;
}

@media print{
  button{ display:none }
  body{ padding:0 }
}
</style>
</head>

<body>

<div class="header">
  <h1>Rekap Pengajuan</h1>
  <button onclick="window.print()">🖨 Cetak PDF</button>
</div>

<table>
  <thead>
    <tr>
      <th>Kostory</th>
      <th>Item</th>
      <th>Vol</th>
      <th>Unit</th>
      <th>Hrg Sat</th>
      <th>Jumlah</th>
    </tr>
  </thead>

  <tbody id="rekap"></tbody>

  <tfoot>
    <tr>
      <td colspan="5" style="text-align:right">Total Jumlah</td>
      <td id="grandTotal">Rp 0</td>
    </tr>
  </tfoot>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let totalAll = 0;

onValue(ref(db, "pengajuan"), snap => {
  console.log("SNAP EXISTS =", snap.exists());
  console.log("RAW VALUE =", snap.val());
});



  document.getElementById("grandTotal").innerText =
    "Rp " + totalAll.toLocaleString();
});
</script>

</body>
</html>
