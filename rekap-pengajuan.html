<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
header {
  background:#050b1f;
  color:#fff;
  padding:18px 24px;
  font-size:22px;
  font-weight:bold;
}
.container {
  max-width:1100px;
  margin:auto;
  padding:24px;
}
.card {
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 16px rgba(0,0,0,.05);
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;

  .filters > div {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.filters label {
  font-size: 14px;
}
  
select[multiple] {
  min-height: 140px;
}

select, input {
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.btn-blue { background:#2563eb; color:white; }
.btn-green { background:#22c55e; color:white; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}
th, td {
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th {
  background:#f1f5f9;
}

.total-box {
  text-align:right;
  font-size:18px;
  font-weight:bold;
  margin-top:16px;
}
  
input[type="month"], select {
  color: #111;
  background: #fff;
}

  
/* PRINT */
@media print {
  header, .filters, .btn-print {
    display:none;
  }
  body {
    background:white;
  }
}
</style>
</head>

<body>
<header>Rekap Pengajuan (Approved)</header>

<div class="container">

  <!-- FILTER -->
  <div class="card">
    <div class="filters">
  <div>
    <label><b>Pilih Bulan & Tahun</b></label>
    <input type="month" id="bulanFilter">
  </div>

  <div>
    <label><b>Pilih Kostory</b></label>
    <select id="kostoryFilter" multiple size="5"></select>
    <small style="color:#6b7280">
      (Ctrl / Shift untuk pilih lebih dari satu)
    </small>
  </div>
</div>


    <div style="display:flex;gap:12px;margin-top:12px">
  <button class="btn-blue" onclick="applyFilter()">Terapkan Filter</button>
  <button class="btn-green btn-print" onclick="window.print()">Cetak / PDF</button>
</div>

  </div>

  <!-- HASIL -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Tanggal/Bulan</th>
          <th>Kostory</th>
          <th>Item</th>
          <th>Volume</th>
          <th>Harga</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="rekapBody"></tbody>
    </table>

    <div class="total-box" id="grandTotal">
      Total: Rp 0
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allData = [];

/* LOAD DATA */
onValue(ref(db,"pengajuan"), snap => {
  allData = [];
  snap.forEach(p => {
    const d = p.val();
    if (d.status === "approved") {
      allData.push(d);
    }
  });
  loadKostory();
  render(allData);
});
  
bulanFilter.value = new Date().toISOString().slice(0,7);

/* KOSTORY OPTIONS */
function loadKostory() {
  const set = new Set(allData.map(d => d.kostory));
  kostoryFilter.innerHTML = "";
  set.forEach(k => {
    kostoryFilter.innerHTML += `<option value="${k}">${k}</option>`;
  });
}

/* FILTER */
window.applyFilter = function () {
  let filtered = [...allData];

  const bulan = bulanFilter.value;
  if (bulan) {
    filtered = filtered.filter(d => d.bulan === bulan);
  }

  const selected = Array.from(kostoryFilter.selectedOptions).map(o => o.value);
  if (selected.length > 0) {
    filtered = filtered.filter(d => selected.includes(d.kostory));
  }

  render(filtered);
};

/* RENDER */
function render(data) {
  rekapBody.innerHTML = "";
  let total = 0;

  data.forEach(d => {
    d.items.forEach(i => {
      total += i.subtotal;
      rekapBody.innerHTML += `
        <tr>
          <td>${d.bulan}</td>
          <td>${d.kostory}</td>
          <td>${i.nama}</td>
          <td>${i.volume} ${i.satuan}</td>
          <td>Rp ${i.harga.toLocaleString()}</td>
          <td>Rp ${i.subtotal.toLocaleString()}</td>
        </tr>
      `;
    });
  });

  grandTotal.innerText = "Total: Rp " + total.toLocaleString();
}
</script>

</body>
</html>
