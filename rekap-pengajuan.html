<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan (Approved)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #050b1f;
  color: #fff;
  padding: 18px 24px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 6px 14px rgba(0,0,0,.06);
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.form-group {
  margin-bottom: 18px;
}

/* KOSTORY BUTTONS */
.kostory-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.kostory-btn {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  cursor: pointer;
  font-size: 14px;
}

.kostory-btn.active {
  background: #2563eb;
  color: #fff;
  border-color: #2563eb;
}

/* BUTTON */
.actions {
  display: flex;
  gap: 12px;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.btn-primary {
  background: #2563eb;
  color: #fff;
}

.btn-success {
  background: #22c55e;
  color: #fff;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
  text-align: center;
}

th {
  background: #f1f5f9;
}

.total {
  margin-top: 14px;
  text-align: right;
  font-size: 18px;
  font-weight: bold;
}

@media print {
  header, .filter-card {
    display: none;
  }
}
</style>
</head>

<body>

<header>Rekap Pengajuan (Approved)</header>

<div class="container">

  <!-- FILTER -->
  <div class="card filter-card">

    <div class="form-group">
      <label>Bulan & Tahun</label>
      <input type="month" id="bulanFilter">
    </div>

    <div class="form-group">
      <label>Kostory</label>
      <div id="kostoryButtons" class="kostory-wrap"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="applyFilter()">Terapkan Filter</button>
      <button class="btn-success" onclick="window.print()">Cetak / PDF</button>
    </div>

  </div>

  <!-- RESULT -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Bulan</th>
          <th>Kostory</th>
          <th>Item</th>
          <th>Volume</th>
          <th>Harga</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="rekapBody"></tbody>
    </table>

    <div class="total" id="grandTotal">Total: Rp 0</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allData = [];
let selectedKostory = [];

bulanFilter.value = new Date().toISOString().slice(0,7);

/* ================= UTIL AMBIL KOSTORY (ANTI STRUKTUR ANEH) ================= */
function getKostory(d) {
  if (d.kostory) return d.kostory;
  if (d.items?.kostory) return d.items.kostory;
  if (Array.isArray(d.items) && d.items[0]?.kostory) return d.items[0].kostory;
  return "-";
}

/* ================= LOAD DATA ================= */
onValue(ref(db, "pengajuan"), snap => {
  allData = [];

  snap.forEach(p => {
    const d = p.val();
    if (d.status === "approved") {
      allData.push(d);
    }
  });

  renderKostoryButtons();
  render(allData);
});

/* ================= KOSTORY BUTTONS ================= */
function renderKostoryButtons() {
  const set = new Set();
  selectedKostory = [];

  allData.forEach(d => {
    const k = getKostory(d);
    if (k && k !== "-") set.add(k);
  });

  kostoryButtons.innerHTML = "";

  set.forEach(k => {
    const btn = document.createElement("button");
    btn.textContent = k;
    btn.className = "kostory-btn active";
    selectedKostory.push(k);

    btn.onclick = () => {
      btn.classList.toggle("active");
      if (selectedKostory.includes(k)) {
        selectedKostory = selectedKostory.filter(x => x !== k);
      } else {
        selectedKostory.push(k);
      }
    };

    kostoryButtons.appendChild(btn);
  });
}

/* ================= FILTER ================= */
window.applyFilter = function () {
  let data = [...allData];

  if (bulanFilter.value) {
    data = data.filter(d => d.bulan === bulanFilter.value);
  }

  if (selectedKostory.length > 0) {
    data = data.filter(d => selectedKostory.includes(getKostory(d)));
  }

  render(data);
};

/* ================= RENDER TABLE ================= */
function render(data) {
  rekapBody.innerHTML = "";
  let total = 0;

  data.forEach(d => {
    const kostory = getKostory(d);

    (d.items || []).forEach(i => {
      total += i.subtotal || 0;

      rekapBody.innerHTML += `
        <tr>
          <td>${d.bulan}</td>
          <td>${kostory}</td>
          <td>${i.nama}</td>
          <td>${i.volume} ${i.satuan}</td>
          <td>Rp ${Number(i.harga).toLocaleString()}</td>
          <td>Rp ${Number(i.subtotal).toLocaleString()}</td>
        </tr>
      `;
    });
  });

  grandTotal.textContent = "Total: Rp " + total.toLocaleString();
}
</script>

</body>
</html>
