<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan (Approved)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #050b1f;
  color: #fff;
  padding: 18px 24px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 16px rgba(0,0,0,.05);
}

/* ===== FILTER ===== */
.filter-row {
  display: flex;
  gap: 24px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 260px;
}

label {
  font-weight: bold;
  font-size: 14px;
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  background: #fff;
  color: #111;
}

select[multiple] {
  height: 160px;
}

/* ===== BUTTON ===== */
.actions {
  margin-top: 16px;
  display: flex;
  gap: 12px;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.btn-primary {
  background: #2563eb;
  color: #fff;
}

.btn-success {
  background: #22c55e;
  color: #fff;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  text-align: center;
}

th {
  background: #f1f5f9;
  font-weight: bold;
}

.total {
  text-align: right;
  font-size: 18px;
  font-weight: bold;
  margin-top: 14px;
}

/* ===== PRINT ===== */
@media print {
  header, .filter-card {
    display: none;
  }
  body {
    background: #fff;
  }
}
</style>
</head>

<body>

<header>Rekap Pengajuan (Approved)</header>

<div class="container">

  <!-- FILTER -->
  <div class="card filter-card">
    <div class="filter-row">
      <div class="field">
        <label>Bulan & Tahun</label>
        <input type="month" id="bulanFilter">
      </div>

      <div class="field">
        <label>Kostory</label>
        <select id="kostoryFilter" multiple></select>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="applyFilter()">Terapkan Filter</button>
      <button class="btn-success" onclick="window.print()">Cetak / PDF</button>
    </div>
  </div>

  <!-- HASIL -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Bulan</th>
          <th>Kostory</th>
          <th>Item</th>
          <th>Volume</th>
          <th>Harga</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="rekapBody"></tbody>
    </table>

    <div class="total" id="grandTotal">
      Total: Rp 0
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allData = [];

bulanFilter.value = new Date().toISOString().slice(0,7);

onValue(ref(db, "pengajuan"), snap => {
  allData = [];
  snap.forEach(p => {
    const d = p.val();
    if (d.status === "approved") {
      allData.push(d);
    }
  });
  loadKostory();
  render(allData);
});

function loadKostory() {
  const set = new Set(allData.map(d => d.kostory));
  kostoryFilter.innerHTML = "";
  set.forEach(k => {
    kostoryFilter.innerHTML += `<option value="${k}">${k}</option>`;
  });
}

window.applyFilter = function () {
  let data = [...allData];

  if (bulanFilter.value) {
    data = data.filter(d => d.bulan === bulanFilter.value);
  }

  const selected = Array.from(kostoryFilter.selectedOptions).map(o => o.value);
  if (selected.length > 0) {
    data = data.filter(d => selected.includes(d.kostory));
  }

  render(data);
};

function render(data) {
  rekapBody.innerHTML = "";
  let total = 0;

  data.forEach(d => {
    d.items.forEach(i => {
      total += i.subtotal;
      rekapBody.innerHTML += `
        <tr>
          <td>${d.bulan}</td>
          <td>${d.kostory}</td>
          <td>${i.nama}</td>
          <td>${i.volume} ${i.satuan}</td>
          <td>Rp ${i.harga.toLocaleString()}</td>
          <td>Rp ${i.subtotal.toLocaleString()}</td>
        </tr>
      `;
    });
  });

  grandTotal.innerText = "Total: Rp " + total.toLocaleString();
}
</script>

</body>
</html>
