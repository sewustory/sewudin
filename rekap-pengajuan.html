<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#fff;
  margin:0;
  padding:24px;
  color:#000;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h1{
  font-size:22px;
  margin:0;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th, td{
  border:1px solid #000;
  padding:6px;
  text-align:center;
}

th{
  background:#f1f1f1;
}

tfoot td{
  font-weight:bold;
}

@media print{
  button{ display:none }
  body{ padding:0 }
}
</style>
</head>

<body>

<div class="header">
  <h1>Rekap Pengajuan</h1>
  <button onclick="window.print()">🖨 Cetak PDF</button>
</div>

<div style="margin-bottom:16px; display:flex; gap:10px; align-items:center">
  <label>
    Tahun:
    <select id="filterTahun"></select>
  </label>

  <label>
    Bulan:
    <select id="filterBulan">
      <option value="">Semua</option>
      <option value="01">Januari</option>
      <option value="02">Februari</option>
      <option value="03">Maret</option>
      <option value="04">April</option>
      <option value="05">Mei</option>
      <option value="06">Juni</option>
      <option value="07">Juli</option>
      <option value="08">Agustus</option>
      <option value="09">September</option>
      <option value="10">Oktober</option>
      <option value="11">November</option>
      <option value="12">Desember</option>
    </select>
  </label>
</div>
  
<table>
  <thead>
    <tr>
      <th>Kostory</th>
      <th>Item</th>
      <th>Vol</th>
      <th>Unit</th>
      <th>Hrg Sat</th>
      <th>Jumlah</th>
    </tr>
  </thead>

  <tbody id="rekap"></tbody>

  <tfoot>
    <tr>
      <td colspan="5" style="text-align:right">Total Jumlah</td>
      <td id="grandTotal">Rp 0</td>
    </tr>
  </tfoot>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
  
let totalAll = 0;
  
function initFilter() {
  const tahunSelect = document.getElementById("filterTahun");
  const currentYear = new Date().getFullYear();

  for (let y = currentYear - 3; y <= currentYear + 1; y++) {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    if (y === currentYear) opt.selected = true;
    tahunSelect.appendChild(opt);
  }
}

function loadRekap() {
  onValue(ref(db, "pengajuan"), snap => {
    const tbody = document.getElementById("rekap");
    tbody.innerHTML = "";
    totalAll = 0;

    snap.forEach(p => {
      const d = p.val();
      if (!d.items || !d.bulan) return;

      const [tahun, bulan] = d.bulan.split("-");

      if (filterTahun.value && filterTahun.value !== tahun) return;
      if (filterBulan.value && filterBulan.value !== bulan) return;

      const items = Object.values(d.items);

      items.forEach(i => {
        totalAll += Number(i.subtotal || 0);

        tbody.innerHTML += `
          <tr>
            <td>${d.kostory}</td>
            <td>${i.nama}</td>
            <td>${i.volume}</td>
            <td>${i.satuan}</td>
            <td>Rp ${Number(i.harga).toLocaleString()}</td>
            <td>Rp ${Number(i.subtotal).toLocaleString()}</td>
          </tr>
        `;
      });
    });

    document.getElementById("grandTotal").innerText =
      "Rp " + totalAll.toLocaleString();
  });
}
initFilter();
loadRekap();

document.getElementById("filterTahun").addEventListener("change", loadRekap);
document.getElementById("filterBulan").addEventListener("change", loadRekap);


</script>

</body>
</html>
