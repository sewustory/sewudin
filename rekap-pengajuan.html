<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Pengajuan (Approved)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}

header {
  background:#050b1f;
  color:#fff;
  padding:18px 24px;
  font-size:22px;
  font-weight:bold;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:24px;
}

.card {
  background:#fff;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 6px 14px rgba(0,0,0,.06);
}

label {
  font-weight:bold;
  display:block;
  margin-bottom:6px;
}

input {
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* CHIP */
.kostory-wrap {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.kostory-chip {
  padding:8px 16px;
  border-radius:999px;
  border:1px solid #cbd5e1;
  background:#f8fafc;
  cursor:pointer;
}

.kostory-chip.active {
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
}

th {
  background:#f1f5f9;
}

.total {
  margin-top:14px;
  text-align:right;
  font-size:18px;
  font-weight:bold;
}

button {
  margin-top:16px;
  padding:10px 18px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  background:#22c55e;
  color:#fff;
}

@media print {
  header, .filter-card {
    display:none;
  }
}
</style>
</head>

<body>

<header>Rekap Pengajuan (Approved)</header>

<div class="container">

  <!-- FILTER -->
  <div class="card filter-card">
    <label>Bulan & Tahun</label>
    <input type="month" id="bulanFilter">

    <br><br>

    <label>Kostory</label>
    <div id="kostoryChips" class="kostory-wrap"></div>

    <button onclick="window.print()">Cetak / PDF</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Bulan</th>
          <th>Kostory</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="rekapBody"></tbody>
    </table>

    <div class="total" id="grandTotal">Total: Rp 0</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
});

const db = getDatabase(app);

let allData = [];
let activeKostory = [];

/* default bulan sekarang */
bulanFilter.value = new Date().toISOString().slice(0,7);

/* ambil kostory sesuai DB kamu */
function getKostory(d) {
  return d.items && d.items.kostory ? d.items.kostory : null;
}

/* load data */
onValue(ref(db,"pengajuan"), snap => {
  allData = [];
  snap.forEach(p => {
    const d = p.val();
    if (d.status === "approved") {
      allData.push(d);
    }
  });
  renderChips();
  applyFilter();
});

/* render chip */
function renderChips() {
  kostoryChips.innerHTML = "";
  activeKostory = [];

  const set = new Set();
  allData.forEach(d => {
    const k = getKostory(d);
    if (k) set.add(k);
  });

  set.forEach(k => {
    const chip = document.createElement("div");
    chip.className = "kostory-chip active";
    chip.textContent = k;
    activeKostory.push(k);

    chip.onclick = () => {
      chip.classList.toggle("active");
      if (activeKostory.includes(k)) {
        activeKostory = activeKostory.filter(x => x !== k);
      } else {
        activeKostory.push(k);
      }
      applyFilter();
    };

    kostoryChips.appendChild(chip);
  });
}

/* auto filter */
bulanFilter.addEventListener("change", applyFilter);

function applyFilter() {
  const data = allData.filter(d =>
    d.bulan === bulanFilter.value &&
    activeKostory.includes(getKostory(d))
  );

  renderTable(data);
}

/* render table */
function renderTable(data) {
  rekapBody.innerHTML = "";
  let total = 0;

  data.forEach(d => {
    total += d.total || 0;
    rekapBody.innerHTML += `
      <tr>
        <td>${d.bulan}</td>
        <td>${getKostory(d)}</td>
        <td>Rp ${Number(d.total).toLocaleString()}</td>
      </tr>
    `;
  });

  grandTotal.textContent = "Total: Rp " + total.toLocaleString();
}
</script>

</body>
</html>
