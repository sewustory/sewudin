<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Daftar Pengajuan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}
header {
  background: #050b1f;
  color: #fff;
  padding: 18px 24px;
  font-size: 22px;
  font-weight: bold;
}
.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 8px 16px rgba(0,0,0,.05);
}
.badge {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}
.pending { background: #fde68a; }
.approved { background: #86efac; }
.rejected { background: #fca5a5; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
td, th {
  padding: 8px;
  border-bottom: 1px solid #eee;
  text-align: center;
}
th {
  background: #f1f5f9;
}
button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
  .delete {
  background: #6b7280;
  color: #fff;
}
/* Mobile fix */
@media (max-width: 768px) {

  .container {
    padding: 12px;
  }

  .card {
    padding: 12px;
  }

  table {
    font-size: 12px;
  }

  th, td {
    padding: 6px 4px;
    white-space: normal;
    word-break: break-word;
  }

  th:nth-child(1),
  td:nth-child(1) {
    width: 30%;
  }

  th:nth-child(2),
  td:nth-child(2) {
    width: 20%;
  }

  th:nth-child(3),
  td:nth-child(3),
  th:nth-child(4),
  td:nth-child(4) {
    width: 25%;
  }
}

.approve { background: #22c55e; color: #fff; }
.reject { background: #ef4444; color: #fff; }
</style>
</head>

<body>
<header style="display:flex;justify-content:space-between;align-items:center">
  <span>Daftar Pengajuan</span>

  <button onclick="kembali()" 
    style="
      background:#22c55e;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    ">
    ⬅ Kembali ke Pengajuan
  </button>
</header>


<div class="container" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let role = "";
let email = "";

onAuthStateChanged(auth, async user => {
  if (!user) location.href = "login.html";

  const snap = await fetchUser(user.uid);
  role = snap.role;
  email = snap.email;

  loadPengajuan();
});

function fetchUser(uid) {
  return new Promise(resolve => {
    onValue(ref(db, "users/" + uid), s => resolve(s.val()), { onlyOnce: true });
  });
}

function loadPengajuan() {
  onValue(ref(db, "pengajuan"), snap => {
    list.innerHTML = "";

    let data = [];

    snap.forEach(p => {
      const d = p.val();

      if (role === "karyawan" && d.oleh !== email) return;

      data.push({
        id: p.key,
        ...d
      });
    });

    // SORTING:
    // 1. pending di atas
    // 2. yang terbaru di atas
    data.sort((a, b) => {
      if (a.status === "pending" && b.status !== "pending") return -1;
      if (a.status !== "pending" && b.status === "pending") return 1;
      return b.id.localeCompare(a.id); // terbaru dulu
    });

    data.forEach(d => {
      list.innerHTML += `
        <div class="card">
          <b>${d.kostory}</b> | ${d.bulan}<br>
          Oleh: ${d.oleh}<br>
          <span class="badge ${d.status}">${d.status.toUpperCase()}</span>

          <table>
            <tr>
              <th>Item</th><th>Volume</th><th>Harga</th><th>Subtotal</th>
            </tr>
            ${d.items.map(i => `
              <tr>
                <td>${i.nama}</td>
                <td>${i.volume} ${i.satuan}</td>
                <td>Rp ${i.harga.toLocaleString()}</td>
                <td>Rp ${i.subtotal.toLocaleString()}</td>
              </tr>
            `).join("")}
          </table>

          <div style="text-align:right;margin-top:10px;font-weight:bold">
            Total: Rp ${d.total.toLocaleString()}
          </div>

          ${role === "admin" && d.status === "pending" ? `
            <div style="margin-top:12px;text-align:right">
              <button class="approve" onclick="updateStatus('${d.id}','approved')">Approve</button>
              <button class="reject" onclick="updateStatus('${d.id}','rejected')">Reject</button>
              <button class="delete" onclick="deletePengajuan('${d.id}')">Delete</button>
            </div>
          ` : ""}
        </div>
      `;
    });
  });
}

window.updateStatus = function (id, status) {
  update(ref(db, "pengajuan/" + id), { status });
};
  import { remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

window.deletePengajuan = function (id) {
  if (!confirm("Yakin hapus pengajuan ini? Data akan hilang permanen.")) return;
  remove(ref(db, "pengajuan/" + id));
};

  window.kembali = function () {
  location.href = "pengajuan.html";
};

</script>
</body>
</html>
