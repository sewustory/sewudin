<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:#f4f6f8;
}
header{
  background:#020617;
  color:#fff;
  padding:16px;
  font-size:20px;
  font-weight:600;
}
.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}
h2{margin:0 0 12px}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-bottom:10px;
  font-size:15px;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.green{background:#22c55e;color:#fff}
.blue{background:#2563eb;color:#fff}
.red{background:#ef4444;color:#fff}

.list{
  margin-top:16px;
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-bottom:10px;
}
.item small{color:#6b7280}
.actions button{margin-left:6px}
</style>
</head>

<body>

<header>Admin Panel</header>

<div class="container">

<!-- ===== KOSTORY ===== -->
<div class="card">
  <h2>Kostory</h2>

  <!-- INPUT -->
  <input id="kostoryInput" placeholder="Nama Kostory">
  <button class="green" onclick="addKostory()">+ Kostory</button>

  <!-- LIST -->
  <div id="kostoryList" class="list"></div>
</div>

<!-- ===== HARGA ===== -->
<div class="card">
  <h2>Harga Satuan</h2>

  <!-- INPUT -->
  <input id="itemName" placeholder="Nama item (contoh: Mengurus Kost)">
  <input id="itemPrice" type="number" placeholder="Harga">
  <input id="itemUnit" placeholder="Satuan (orang / kg / unit)">
  <button class="green" onclick="addItem()">+ Item</button>

  <!-- LIST -->
  <div id="itemList" class="list"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, update } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const makeKey = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"_");

/* ===== KOSTORY ===== */
window.addKostory = ()=>{
  const name = kostoryInput.value.trim();
  if(!name) return alert("Nama kosong");
  set(ref(db,"cabang/"+makeKey(name)),{nama:name});
  kostoryInput.value="";
};

onValue(ref(db,"cabang"),snap=>{
  kostoryList.innerHTML="";
  snap.forEach(c=>{
    const d=c.val();
    kostoryList.innerHTML+=`
      <div class="item">
        <b>${d.nama}</b>
        <div class="actions">
          <button class="red" onclick="remove(ref(db,'cabang/${c.key}'))">hapus</button>
        </div>
      </div>`;
  });
});

/* ===== HARGA ===== */
window.addItem = ()=>{
  const n=itemName.value.trim();
  const p=Number(itemPrice.value);
  const u=itemUnit.value.trim();
  if(!n||!p||!u) return alert("Lengkapi data");

  set(ref(db,"harga/"+makeKey(n)),{
    nama:n,harga:p,satuan:u
  });
  itemName.value=itemPrice.value=itemUnit.value="";
};

onValue(ref(db,"harga"),snap=>{
  itemList.innerHTML="";
  snap.forEach(c=>{
    const d=c.val();
    itemList.innerHTML+=`
      <div class="item">
        <div>
          <b>${d.nama}</b><br>
          <small>Rp ${d.harga.toLocaleString()} / ${d.satuan}</small>
        </div>
        <div class="actions">
          <button class="blue" onclick="editHarga('${c.key}',${d.harga})">edit</button>
          <button class="red" onclick="remove(ref(db,'harga/${c.key}'))">hapus</button>
        </div>
      </div>`;
  });
});

window.editHarga = (key,h)=>{
  const v=prompt("Harga baru",h);
  if(v!==null) update(ref(db,"harga/"+key),{harga:Number(v)});
};
</script>

</body>
</html>
