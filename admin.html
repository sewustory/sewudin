<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  margin:0;
}
header{
  background:#020617;
  color:#fff;
  padding:16px;
  font-size:20px;
}
.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:10px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
}
input{
  padding:8px;
  width:100%;
  margin:6px 0;
}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.add{background:#22c55e;color:#fff}
.edit{background:#2563eb;color:#fff}
.del{background:#ef4444;color:#fff}
.group{
  margin-top:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>Admin Panel</header>

<div class="card">
  <h3>Kostory</h3>
  <input id="cabangInput" placeholder="Nama Kostory">
  <button class="add" onclick="tambahCabang()">+ Kostory</button>
  <div id="cabangList"></div>
</div>

<div class="card">
  <h3>Harga Satuan</h3>
  <div id="hargaList"></div>
  <button class="add" onclick="tambahItem()">+ item</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ================= FIREBASE CONFIG ================= */
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
});

const db = firebase.database();

/* ================= CABANG ================= */
const cabangRef = db.ref("cabang");

cabangRef.on("value", snap=>{
  cabangList.innerHTML="";
  snap.forEach(c=>{
    cabangList.innerHTML += `
      <div class="row">
        ${c.val().nama}
        <span>
          <button class="edit" onclick="editCabang('${c.key}')">edit</button>
          <button class="del" onclick="hapusCabang('${c.key}')">delete</button>
        </span>
      </div>`;
  });
});

function tambahCabang(){
  const nama = cabangInput.value.trim();
  if(!nama) return;
  cabangRef.child(nama.toLowerCase()).set({ nama });
  cabangInput.value="";
}

function editCabang(key){
  const n = prompt("Nama baru:");
  if(n) cabangRef.child(key).set({ nama:n });
}

function hapusCabang(key){
  if(confirm("Hapus kostory ini?")){
    cabangRef.child(key).remove();
  }
}

/* ================= HARGA ================= */
const hargaRef = db.ref("harga");

hargaRef.on("value", snap=>{
  hargaList.innerHTML="";
  snap.forEach(h=>{
    const v = h.val();
    hargaList.innerHTML += `
      <div class="row" id="h-${h.key}">
        <div>
          ${v.label} /${v.satuan}<br>
          Rp ${v.harga || "-"}
        </div>
        <button class="edit" onclick="editHarga('${h.key}')">update</button>
      </div>`;
  });
});

function editHarga(key){
  hargaRef.child(key).once("value").then(s=>{
    const v=s.val();
    document.getElementById("h-"+key).innerHTML=`
      <input type="number" id="harga-${key}" value="${v.harga}">
      <button class="add" onclick="simpanHarga('${key}')">Simpan</button>`;
  });
}

function simpanHarga(key){
  const val = document.getElementById("harga-"+key).value;
  hargaRef.child(key+"/harga").set(+val);
}

function tambahItem(){
  const key = prompt("key (tanpa spasi, contoh: laundry)");
  const label = prompt("nama item");
  const satuan = prompt("satuan (kg, hari, unit)");
  if(!key||!label||!satuan) return;
  hargaRef.child(key).set({ label, satuan, harga:0 });
}
</script>
</body>
</html>
