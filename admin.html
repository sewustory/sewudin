<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#f1f5f9;font-family:Arial}
header{
  background:#020617;color:white;
  padding:16px;font-size:18px;font-weight:bold;
}
.box{
  background:white;margin:16px;padding:16px;border-radius:14px;
}
input,select,button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:10px;border:1px solid #cbd5e1;
}
button{
  background:#2563eb;color:white;
  border:none;font-weight:bold;
}
</style>
</head>

<body>
<header>Admin Panel</header>

<div class="box">
  <h3>Tambah Cabang</h3>
  <input id="cabangBaru" placeholder="Nama cabang">
  <button onclick="tambahCabang()">Tambah</button>
</div>

<div class="box">
  <h3>Update Harga</h3>
  <input id="kategori" placeholder="Kategori">
  <input id="harga" type="number" placeholder="Harga">
  <button onclick="simpanHarga()">Simpan</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
});

firebase.auth().onAuthStateChanged(u=>{
  if(!u) location.href="login.html";
});

function tambahCabang(){
  const nama = cabangBaru.value.toLowerCase();
  firebase.database().ref("cabang/"+nama).set({nama});
  alert("Cabang ditambahkan");
}

function simpanHarga(){
  firebase.database().ref("harga/"+kategori.value)
    .set(Number(harga.value));
  alert("Harga disimpan");
}
</script>
</body>
</html>
