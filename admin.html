<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#020617;color:white;padding:16px;font-size:18px;font-weight:bold}
.container{padding:16px}
.card{background:white;padding:16px;border-radius:14px;margin-bottom:16px}
h3{margin-top:0}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.actions button{margin-left:6px;padding:4px 8px;border:none;border-radius:6px;cursor:pointer}
.edit{background:#eab308}
.delete{background:#ef4444;color:white}
.add{background:#22c55e;border:none;padding:8px 12px;border-radius:8px}
input{padding:8px;border-radius:8px;border:1px solid #cbd5e1}
.hidden{display:none}
</style>
</head>

<body>
<header>Admin Panel</header>
<div class="container">

<!-- CABANG -->
<div class="card">
<h3>Kostory</h3>
<div id="listCabang"></div>

<input id="cabangBaru" placeholder="Nama kostory baru">
<button class="add" onclick="tambahCabang()">+ Kostory</button>
</div>

<!-- HARGA -->
<div class="card">
<h3>Harga Satuan</h3>
<div id="listHarga"></div>

<hr>
<input id="keyBaru" placeholder="Key (contoh: laundry)">
<input id="labelBaru" placeholder="Nama kategori">
<input id="satuanBaru" placeholder="Satuan">
<input id="hargaBaru" type="number" placeholder="Harga">
<button class="add" onclick="tambahKategori()">+ Kategori</button>
</div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
});

firebase.auth().onAuthStateChanged(u=>{
  if(!u) location.href="login.html";
});

// ===== CABANG =====
firebase.database().ref("cabang").on("value",snap=>{
  listCabang.innerHTML="";
  snap.forEach(c=>{
    const k=c.key;
    const n=c.val().nama;
    listCabang.innerHTML+=`
      <div class="list-row">
        <div>${n}</div>
        <div class="actions">
          <button class="edit" onclick="editCabang('${k}','${n}')">edit</button>
          <button class="delete" onclick="hapusCabang('${k}')">delete</button>
        </div>
      </div>`;
  });
});

function tambahCabang(){
  const n=cabangBaru.value.trim();
  if(!n)return;
  firebase.database().ref("cabang/"+n.toLowerCase()).set({nama:n});
  cabangBaru.value="";
}

function editCabang(k,n){
  const baru=prompt("Ubah nama",n);
  if(!baru)return;
  firebase.database().ref("cabang/"+k).set({nama:baru});
}

function hapusCabang(k){
  if(confirm("Hapus kostory?"))
    firebase.database().ref("cabang/"+k).remove();
}

// ===== HARGA =====
firebase.database().ref("harga").on("value",snap=>{
  listHarga.innerHTML="";
  snap.forEach(h=>{
    const k=h.key,v=h.val();
    listHarga.innerHTML+=`
      <div class="list-row">
        <div>
          <b>${v.label}</b><br>
          Rp ${v.harga.toLocaleString()} /${v.satuan}
        </div>
        <div class="actions">
          <button class="edit" onclick="editHarga('${k}',${v.harga})">update</button>
        </div>
      </div>`;
  });
});

function editHarga(k,h){
  const baru=prompt("Harga baru",h);
  if(!baru)return;
  firebase.database().ref("harga/"+k+"/harga").set(Number(baru));
}

function tambahKategori(){
  firebase.database().ref("harga/"+keyBaru.value).set({
    label:labelBaru.value,
    satuan:satuanBaru.value,
    harga:Number(hargaBaru.value)
  });
  keyBaru.value=labelBaru.value=satuanBaru.value=hargaBaru.value="";
}
</script>
</body>
</html>
