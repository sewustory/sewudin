<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
header{background:#020617;color:#fff;padding:16px;font-size:20px}
.card{background:#fff;margin:16px;padding:16px;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.btn{padding:4px 10px;border-radius:6px;border:none;cursor:pointer}
.add{background:#22c55e;color:#fff}
.edit{background:#2563eb;color:#fff}
.del{background:#ef4444;color:#fff}
input{padding:6px;margin:4px 0}
.inline input{width:90px}
</style>
</head>

<body>

<header>Admin Panel</header>

<div class="card">
<h3>Kostory</h3>
<input id="cabangInput" placeholder="Nama Kostory">
<button class="btn add" onclick="addCabang()">+ Kostory</button>
<div id="cabangList"></div>
</div>

<div class="card">
<h3>Harga Satuan</h3>
<div id="hargaList"></div>
<button class="btn add" onclick="addHarga()">+ item</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0",
  storageBucket: "sewudin-543e0.appspot.com",
  messagingSenderId: "915734517079",
  appId: "1:915734517079:web:e56543423814ce30e69a12"
});

const db = firebase.database();

/* ===== KOSTORY ===== */
const cabangRef = db.ref("cabang");

cabangRef.on("value", s=>{
  cabangList.innerHTML="";
  s.forEach(c=>{
    cabangList.innerHTML+=`
      <div class="row">
        ${c.val().nama}
        <span>
          <button class="btn edit" onclick="editCabang('${c.key}')">edit</button>
          <button class="btn del" onclick="hapusCabang('${c.key}')">delete</button>
        </span>
      </div>`;
  });
});

function addCabang(){
  const n=cabangInput.value.trim();
  if(!n)return;
  cabangRef.child(n.toLowerCase()).set({nama:n});
  cabangInput.value="";
}

function editCabang(k){
  const n=prompt("Nama baru");
  if(n)cabangRef.child(k).set({nama:n});
}

function hapusCabang(k){
  if(confirm("hapus?"))cabangRef.child(k).remove();
}

/* ===== HARGA ===== */
const hargaRef=db.ref("harga");

hargaRef.on("value",s=>{
  hargaList.innerHTML="";
  s.forEach(h=>{
    const v=h.val();
    hargaList.innerHTML+=`
    <div class="row" id="h-${h.key}">
      <div>${v.label} — Rp ${v.harga} /${v.satuan}</div>
      <button class="btn edit" onclick="editHarga('${h.key}')">update</button>
    </div>`;
  });
});

function editHarga(k){
  hargaRef.child(k).once("value").then(s=>{
    const v=s.val();
    document.getElementById("h-"+k).innerHTML=`
      <div class="inline">
        <input id="hval-${k}" type="number" value="${v.harga}">
        <button class="btn add" onclick="saveHarga('${k}','${v.label}','${v.satuan}')">simpan</button>
      </div>`;
  });
}

function saveHarga(k,l,s){
  const v=+document.getElementById("hval-"+k).value;
  hargaRef.child(k).set({label:l,satuan:s,harga:v});
}

function addHarga(){
  const key=prompt("key (contoh: laundry)");
  const label=prompt("nama");
  const satuan=prompt("satuan");
  if(key&&label&&satuan){
    hargaRef.child(key).set({label,satuan,harga:0});
  }
}
</script>
</body>
</html>
