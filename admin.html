<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<!-- ===== STYLE ===== -->
<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, sans-serif;
  background:#f4f6f8;
}

header{
  background:linear-gradient(90deg,#020617,#020617);
  color:white;
  padding:16px;
  font-size:20px;
  font-weight:600;
}

.container{
  padding:16px;
  max-width:800px;
  margin:auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}

h2{
  margin:0 0 12px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.btn-green{background:#22c55e;color:white}
.btn-blue{background:#2563eb;color:white}
.btn-red{background:#ef4444;color:white}
.btn-gray{background:#e5e7eb}

.list{
  margin-top:12px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.item small{color:#6b7280}

.actions button{
  margin-left:6px;
  padding:6px 10px;
  font-size:13px;
}
</style>
</head>

<body>

<header>Admin Panel</header>

<div class="container">

<!-- ===== KOSTORY ===== -->
<div class="card">
  <h2>Kostory</h2>
  <input id="kostoryName" placeholder="Nama Kostory">
  <button class="btn-green" onclick="addKostory()">+ Kostory</button>

  <div id="kostoryList" class="list"></div>
</div>

<!-- ===== HARGA SATUAN ===== -->
<div class="card">
  <h2>Harga Satuan</h2>

  <input id="itemName" placeholder="Nama item (contoh: Mengurus Kost)">
  <input id="itemPrice" type="number" placeholder="Harga">
  <input id="itemUnit" placeholder="Satuan (orang / kg / unit)">
  <button class="btn-green" onclick="addItem()">+ Item</button>

  <div id="itemList" class="list"></div>
</div>

</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove, update } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV0kqdWP7rNx8KSONHNgfz29NP6Jv5yUM",
  authDomain: "sewudin-543e0.firebaseapp.com",
  databaseURL: "https://sewudin-543e0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sewudin-543e0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== UTIL ===== */
function makeKey(text){
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_|_$/g,"");
}

/* ===== KOSTORY ===== */
window.addKostory = () =>{
  const name = kostoryName.value.trim();
  if(!name) return alert("Nama kosong");

  const key = makeKey(name);
  set(ref(db,"cabang/"+key),{nama:name});
  kostoryName.value="";
};

onValue(ref(db,"cabang"),snap=>{
  kostoryList.innerHTML="";
  snap.forEach(c=>{
    const d=c.val();
    kostoryList.innerHTML+=`
      <div class="item">
        <b>${d.nama}</b>
        <div class="actions">
          <button class="btn-red" onclick="delKostory('${c.key}')">hapus</button>
        </div>
      </div>`;
  });
});

window.delKostory = key=>{
  if(confirm("Hapus kostory?"))
    remove(ref(db,"cabang/"+key));
};

/* ===== HARGA ===== */
window.addItem = ()=>{
  const name=itemName.value.trim();
  const price=Number(itemPrice.value);
  const unit=itemUnit.value.trim();

  if(!name||!price||!unit) return alert("Lengkapi data");

  const key=makeKey(name);
  set(ref(db,"harga/"+key),{
    nama:name,
    harga:price,
    satuan:unit
  });

  itemName.value="";
  itemPrice.value="";
  itemUnit.value="";
};

onValue(ref(db,"harga"),snap=>{
  itemList.innerHTML="";
  snap.forEach(c=>{
    const d=c.val();
    itemList.innerHTML+=`
      <div class="item">
        <div>
          <b>${d.nama}</b><br>
          <small>Rp ${d.harga.toLocaleString()} / ${d.satuan}</small>
        </div>
        <div class="actions">
          <button class="btn-blue" onclick="editItem('${c.key}','${d.nama}',${d.harga},'${d.satuan}')">edit</button>
          <button class="btn-red" onclick="delItem('${c.key}')">hapus</button>
        </div>
      </div>`;
  });
});

window.editItem=(key,n,h,s)=>{
  const price=prompt("Harga",h);
  if(price===null) return;
  update(ref(db,"harga/"+key),{harga:Number(price)});
};

window.delItem=key=>{
  if(confirm("Hapus item?"))
    remove(ref(db,"harga/"+key));
};
</script>

</body>
</html>
